name: tests
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12.*' }
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.5', laravel: '12.*' }
          - { php: '8.3', laravel: '13.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: mbstring, zip, xmlreader, dom
          coverage: none
      - name: Use the published core package instead of the local path repository
        run: composer config --unset repositories.0
      - run: composer require --dev "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/pint --test
